name: Auto Update BibTeX from ORCID

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18点 = 北京时间 2点
  workflow_dispatch:

jobs:
  update-bib:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run ORCID BibTeX update script
        run: python scripts/auto-update.py
        continue-on-error: false

      - name: Check for changes in papers.bib
        id: check_changes
        run: |
          if git diff --quiet _bibliography/papers.bib; then
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✅ No changes to papers.bib"
          else
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "🔄 Detected changes to papers.bib"
          fi

      - name: Configure Git user
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Commit and push updated papers.bib
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add _bibliography/papers.bib
          git commit -m "chore: auto-update papers.bib $(date +'%Y-%m-%d %H:%M:%S')"
          # 使用 PAT_TOKEN 推送，确保触发 deploy.yml
          git push https://${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}.git main
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Auto-update script failed! Check the logs for details."